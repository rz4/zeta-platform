name: gates

# The gate ladder, from the discovery tree. Stages that need the
# toolchain image are stubbed until FOUNDING step 2 lands; each stub
# fails loudly rather than passing vacuously — a gate that cannot
# fail is not a gate.

on:
  push:
  pull_request:

jobs:
  law:
    name: law (the full suite, in the gates image)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rz4/zeta-gates:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: run the law's tests
        run: python -m pytest tests -q

  cross:
    name: cross (the standing suite — every claim, both machines)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rz4/zeta-gates:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: zeta suite — cross and glass gates, every claim witnessed
        run: python -m zeta.cli suite --gate both -j 4

  lint-ratchet:
    name: lint ratchet (count both ways)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rz4/zeta-gates:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pytest tests/test_lint.py -q

  regen:
    name: regen (item 25 — generators reproduce their carts)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rz4/zeta-gates:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pytest tests/test_regen.py -q
